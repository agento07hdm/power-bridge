<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>power-bridge – WLAN einrichten</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#1a1a2e;color:#eee;padding:1.5rem;max-width:440px;margin:0 auto}
h1{color:#e94560;margin-bottom:.5rem;font-size:1.5rem;font-weight:700}
p.sub{color:#aaa;font-size:.9rem;margin-bottom:1.75rem;line-height:1.5}
label{display:block;font-size:.85rem;color:#aaa;margin-bottom:.4rem}
select,input[type="text"],input[type="password"]{
  width:100%;padding:.65rem .75rem;border-radius:.5rem;border:1px solid #333;
  background:#0f3460;color:#eee;font-size:1rem;margin-bottom:1rem;
  -webkit-appearance:none;appearance:none}
select:focus,input:focus{outline:none;border-color:#e94560}
.btn{display:block;width:100%;padding:.75rem;border-radius:.5rem;border:none;
  cursor:pointer;font-size:1rem;font-weight:600;transition:opacity .15s;
  margin-bottom:.75rem;text-align:center}
.btn-primary{background:#e94560;color:#fff}
.btn-secondary{background:#0f3460;color:#eee;border:1px solid #333;font-size:.88rem}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.4;cursor:default}
.pw-wrap{position:relative;margin-bottom:1rem}
.pw-wrap input{margin-bottom:0;padding-right:3rem}
.pw-toggle{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);
  background:none;border:none;color:#aaa;cursor:pointer;font-size:1.1rem;line-height:1}
.refresh-row{display:flex;justify-content:flex-end;margin-bottom:.3rem}
.refresh-btn{background:none;border:none;color:#5b8dee;cursor:pointer;font-size:.8rem;text-decoration:underline}
.status{padding:.75rem 1rem;border-radius:.5rem;margin-top:1rem;font-size:.9rem;
  display:none;line-height:1.5}
.status.show{display:block}
.status-connecting{background:#0c2340;color:#93c5fd}
.status-success{background:#064e3b;color:#6ee7b7}
.status-error{background:#4a0e0e;color:#f87171}
</style>
</head>
<body>
<h1>⚡ power-bridge</h1>
<p class="sub">Verbinde die Bridge mit deinem Heim-WLAN.</p>

<label>WLAN-Netz</label>
<div class="refresh-row">
  <button type="button" class="refresh-btn" id="refresh-btn" onclick="scanWifi()">🔄 Aktualisieren</button>
</div>
<select id="ssid-select" onchange="onSelectSSID()">
  <option value="">— Netzwerke werden geladen… —</option>
</select>
<input type="text" id="ssid-input" placeholder="Netzwerkname (SSID)" autocomplete="off" autocorrect="off" spellcheck="false">

<label>Passwort</label>
<div class="pw-wrap">
  <input type="password" id="wifi-password" placeholder="Passwort" autocomplete="current-password">
  <button type="button" class="pw-toggle" id="pw-toggle-btn" onclick="togglePassword()" title="Passwort anzeigen">👁</button>
</div>

<button type="button" class="btn btn-primary" id="connect-btn" onclick="connect()">Verbinden</button>

<div id="status-box" class="status"></div>

<script>
var pollTimer = null;
var pollStart = 0;
var fetchFailures = 0;
// wifiConnectionTimeoutSecs on the server is 35 s; allow 50 s total.
var POLL_TIMEOUT_MS = 55000;
// Two consecutive fetch failures to the AP IP → assume AP is gone (connected).
var MAX_FETCH_FAILURES = 2;

window.addEventListener('load', function() {
  scanWifi();
  // Pre-fill SSID from query parameter, e.g. when linked from status page.
  var params = new URLSearchParams(window.location.search);
  var ssid = params.get('ssid');
  if (ssid) { document.getElementById('ssid-input').value = ssid; }
});

function scanWifi() {
  var sel = document.getElementById('ssid-select');
  var btn = document.getElementById('refresh-btn');
  sel.innerHTML = '<option value="">— Suche läuft… —</option>';
  btn.disabled = true;
  fetch('/setup/scan')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      btn.disabled = false;
      var ssids = d.ssids || [];
      if (ssids.length === 0) {
        sel.innerHTML = '<option value="">— Keine Netze gefunden —</option>';
        return;
      }
      sel.innerHTML = '<option value="">— Netz auswählen —</option>';
      ssids.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sel.appendChild(opt);
      });
      // Auto-select if SSID input already filled (e.g. from query param).
      var cur = document.getElementById('ssid-input').value.trim();
      if (cur) {
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === cur) { sel.selectedIndex = i; break; }
        }
      }
    })
    .catch(function() {
      btn.disabled = false;
      sel.innerHTML = '<option value="">— Suche fehlgeschlagen —</option>';
    });
}

function onSelectSSID() {
  var val = document.getElementById('ssid-select').value;
  if (val) { document.getElementById('ssid-input').value = val; }
}

function togglePassword() {
  var inp = document.getElementById('wifi-password');
  var btn = document.getElementById('pw-toggle-btn');
  if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; btn.title = 'Passwort verbergen'; }
  else                         { inp.type = 'password'; btn.textContent = '👁'; btn.title = 'Passwort anzeigen'; }
}

function setStatus(cls, html) {
  var box = document.getElementById('status-box');
  box.className = 'status show ' + cls;
  box.innerHTML = html;
}

function connect() {
  var ssid = document.getElementById('ssid-input').value.trim() ||
             document.getElementById('ssid-select').value.trim();
  if (!ssid) { setStatus('status-error', '⚠ Bitte ein WLAN-Netz auswählen oder eingeben.'); return; }

  document.getElementById('connect-btn').disabled = true;
  setStatus('status-connecting', '⏳ Verbinde mit <b>' + escHtml(ssid) + '</b>…');

  var pass = document.getElementById('wifi-password').value;
  fetch('/wifi/connect', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'ssid=' + encodeURIComponent(ssid) + '&password=' + encodeURIComponent(pass)
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.error) {
      setStatus('status-error', '⚠ ' + escHtml(d.error));
      document.getElementById('connect-btn').disabled = false;
      return;
    }
    // status === "connecting"
    setStatus('status-connecting', '⏳ Verbindung wird hergestellt… Bitte warte ca. 30–45 Sekunden.');
    pollStart = Date.now();
    fetchFailures = 0;
    pollTimer = setInterval(pollStatus, 2500);
  })
  .catch(function() {
    // The server may have restarted already → AP might be gone.
    setStatus('status-connecting', '⏳ Verbinde… Browser-Verbindung verloren. Bitte warten.');
    pollStart = Date.now();
    fetchFailures = 1;
    pollTimer = setInterval(pollStatus, 3000);
  });
}

function pollStatus() {
  if (Date.now() - pollStart > POLL_TIMEOUT_MS) {
    clearInterval(pollTimer);
    // Check if we could not reach the server at all (AP gone = success).
    if (fetchFailures >= MAX_FETCH_FAILURES) {
      onConnected();
    } else {
      setStatus('status-error',
        '⚠ Zeitüberschreitung. Verbindung nicht erfolgreich oder SSID/Passwort prüfen.<br>' +
        'Das Gerät fällt automatisch in den AP-Modus zurück.');
      document.getElementById('connect-btn').disabled = false;
    }
    return;
  }
  fetch('/api/status', {signal: AbortSignal.timeout(2000)})
    .then(function(r) { return r.json(); })
    .then(function(d) {
      fetchFailures = 0; // reset on success
      if (!d.is_ap_mode && d.bridge_ip && d.bridge_ip !== '192.168.4.1') {
        clearInterval(pollTimer);
        onConnected();
      }
      // Still in AP mode – keep polling.
    })
    .catch(function() {
      fetchFailures++;
      if (fetchFailures >= MAX_FETCH_FAILURES) {
        clearInterval(pollTimer);
        onConnected();
      }
    });
}

function onConnected() {
  setStatus('status-success',
    '✅ Bridge verbunden!<br><br>' +
    'Dein Gerät wechselt jetzt automatisch zurück in dein Heim-WLAN.<br>' +
    'Die Bridge ist dann erreichbar unter:<br><br>' +
    '<b><a href="http://power-bridge.local" style="color:#6ee7b7">http://power-bridge.local</a></b><br>' +
    '<span style="font-size:.82rem;color:#9ca3af">(oder über <a href="http://power-bridge" style="color:#6ee7b7">http://power-bridge</a>,' +
    ' falls dein Router das unterstützt)</span>');
  // Try to navigate there after a short delay.
  setTimeout(function() { window.location.href = 'http://power-bridge.local'; }, 6000);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
</script>
</body>
</html>
