name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege by default; each job grants only what it needs.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  build:
    name: Build ARMv6 binary
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "6"
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }} -X github.com/fedzzito/power-bridge/internal/server.Version=${{ github.ref_name }}" \
            -trimpath \
            -o power-bridge-${{ github.ref_name }}-linux-armv6 \
            ./cmd/power-bridge

      - name: Generate SHA256 checksums
        run: sha256sum power-bridge-${{ github.ref_name }}-linux-armv6 > SHA256SUMS

      - name: Upload binary + checksums artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary
          path: |
            power-bridge-${{ github.ref_name }}-linux-armv6
            SHA256SUMS

  attest:
    name: Attest build provenance
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: binary

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: power-bridge-${{ github.ref_name }}-linux-armv6

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: attest
    # Configure required reviewers on this environment (Settings > Environments
    # > release) to require a human approval before any release is published.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: binary

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            power-bridge-${{ github.ref_name }}-linux-armv6
            SHA256SUMS
