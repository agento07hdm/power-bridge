name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  build:
    name: Build ARMv6 binary
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: "6"
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags="-s -w -X main.version=${{ github.ref_name }} -X github.com/fedzzito/power-bridge/internal/server.Version=${{ github.ref_name }}" \
            -trimpath \
            -o power-bridge-${{ github.ref_name }}-linux-armv6 \
            ./cmd/power-bridge

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: binary
          path: power-bridge-${{ github.ref_name }}-linux-armv6

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: binary

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: power-bridge-${{ github.ref_name }}-linux-armv6
